components:
  schemas:
    AudienceEnum:
      enum:
      - students
      - partners
      - employees
      type: string
      description: |-
        * `students` - Абитуриенты
        * `partners` - Партнёры
        * `employees` - Сотрудники
    BetterEnum:
      enum:
      - lower
      - higher
      type: string
      description: |-
        * `lower` - Меньше
        * `higher` - Больше
    Case:
      type: object
      description: Run model clean() for PATCH as well as creates; DB remains final
        constraint guard.
      properties:
        id:
          type: integer
          readOnly: true
        enterprise:
          type: integer
        metric:
          type: integer
        metric_detail:
          allOf:
          - $ref: '#/components/schemas/Metric'
          readOnly: true
        title:
          type: string
          maxLength: 200
        problem:
          type: string
        solution:
          type: string
        value_before:
          type: number
          format: double
          minimum: 0
        value_after:
          type: number
          format: double
          minimum: 0
        improvement_percent:
          type: number
          format: double
          nullable: true
          readOnly: true
        tour_links:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
      required:
      - enterprise
      - id
      - improvement_percent
      - metric
      - metric_detail
      - problem
      - solution
      - title
      - tour_links
      - value_after
      - value_before
