# Только для автономного запуска 3D-тура (docker-compose.3d.yml).
# Общий nginx проекта (раздача фронтенда, /media, прокси /api) — в папке nginx/ у бэкенда.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /assets/ {
    expires 7d;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
